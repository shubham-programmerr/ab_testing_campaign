# A/B Testing Campaign Analysis Project Configuration

# Power Analysis Settings
power_analysis:
  alpha: 0.05  # Significance level
  power: 0.80  # Statistical power
  effect_size: 0.2  # Cohen's d (small effect)
  min_sample_size: 100

# Statistical Test Settings
statistical_tests:
  default_alpha: 0.05
  confidence_level: 0.95
  min_observations: 30  # For t-test validity
  
# Data Validation
data_validation:
  srm_threshold: 0.05  # Sample Ratio Mismatch threshold
  check_duplicates: true
  check_missing_values: true
  
# Segmentation
segmentation:
  demographics:
    - age_group
    - gender
    - region
  device_types:
    - mobile
    - desktop
    - tablet
    
# Dashboard Settings
dashboard:
  port: 8501
  theme: light
  default_metric_type: continuous
  
# Output Settings
output:
  figures_dir: reports/figures
  export_format: xlsx
  include_confidence_intervals: true
  include_effect_sizes: true
